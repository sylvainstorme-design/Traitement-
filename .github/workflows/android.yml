name: Construire l'application Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Construire l'APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk MonTraitement.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MonTraitement
          path: MonTraitement.apk
      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Mon traitement 1.${{ github.run_number }}
          body: "Téléchargez MonTraitement.apk ci-dessous depuis la tablette, puis ouvrez-le pour l'installer."
          files: MonTraitement.apk
          make_latest: true
